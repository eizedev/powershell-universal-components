version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # a just-published release has had no time for anyone to notice if it is malicious or broken
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/modules/*"
      - "/docs/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    # React must stay at the version PSU provides at runtime (18.3.1 in PSU 2026.3)
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Unit tests
        run: |
          # no install scripts: the tests need none, and a hijacked dependency could run one
          npm ci --no-audit --no-fund --ignore-scripts
          npm test
      # The growth guards (build/growth.js): a ratchet on build/growth-baseline.json, one step each so
      # a red step names its guard, and each runs when an earlier step failed. The powershell guard
      # uses the runner's pwsh.
      - name: PowerShell file and function size
        if: ${{ !cancelled() }}
        run: node build/growth.js powershell
      - name: JavaScript function size and complexity
        if: ${{ !cancelled() }}
        run: node build/growth.js javascript
      - name: Duplicated JavaScript
        if: ${{ !cancelled() }}
        run: node build/growth.js duplication
      - name: Docs size
        if: ${{ !cancelled() }}
        run: node build/growth.js docs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # every folder in modules/ (tests/js/ci.test.js checks it)
        module: ["PowerShellUniversal.Component.ECharts", "PowerShellUniversal.Component.ECharts.Demo", "PowerShellUniversal.Component.Perspective", "PowerShellUniversal.Component.Pivot", "PowerShellUniversal.Component.Pivot.Demo"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # a demo module requires its component module, which this job does not install: it is loaded from
      # source by the Pester tests
      - name: Build module, and load the built folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = ./build/Build-Module.ps1 -Module '${{ matrix.module }}'
          if (-not '${{ matrix.module }}'.EndsWith('.Demo')) { ./build/Test-BuiltModule.ps1 -Path $built.FullName }
      # needs the module's packages, which only this job installs; selects the Describe "Build-Module.ps1
      # with the pivot module" of tests/powershell/Build-Module.Tests.ps1 by name: pivotkit-core's schema
      # files of the bundle's version, pivotkit-react's tip ids
      # the unit tests that need the pivot module's packages (skipped in the javascript job)
      - name: Pivot links and theme against the installed pivotkit packages
        if: matrix.module == 'PowerShellUniversal.Component.Pivot'
        run: node --test tests/js/pivot-links.test.js tests/js/pivot.test.js
      - name: Pivot matches the pivotkit packages it is built with
        if: matrix.module == 'PowerShellUniversal.Component.Pivot'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name Pester -Version 6.2.0 -TrustRepository -Quiet
          Import-Module Pester -RequiredVersion 6.2.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/powershell/Build-Module.Tests.ps1'
          $config.Filter.FullName = '*pivot module*'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -or $result.PassedCount -lt 2) { throw 'The pivot module was not checked against its pivotkit packages, or differs from them.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.module }}
          path: output/${{ matrix.module }}
          retention-days: 14

  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name Pester -Version 6.2.0 -TrustRepository -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -TrustRepository -Quiet
          ./build/Invoke-ScriptAnalysis.ps1
          Import-Module Pester -RequiredVersion 6.2.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  site:
    # the documentation site the browser tests open (Build-Site.ps1 needs pwsh, which the Playwright
    # image lacks; Zensical with the shared design of eizedev/brand)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Examples, reference and the charts script
        shell: pwsh
        run: ./docs/site/Build-Site.ps1
      - uses: eizedev/brand/docs-site@8d8d554bf72868842330a40a61e843ec631edcf5 # v1.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/

  browser:
    # the documentation site renders the module's own component: tested in Chromium, Firefox and WebKit.
    # Playwright's own image carries the browsers and their system libraries, so nothing is installed
    # with apt (the Ubuntu mirror made "playwright install --with-deps" run into the timeout). Its
    # version must be the one of @playwright/test in package-lock.json; tests/js/ci.test.js checks that.
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/
      - name: Browser tests
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run test:browser

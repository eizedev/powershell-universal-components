name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Unit tests
        run: |
          # no install scripts: the tests need none, and a hijacked dependency could run one
          npm ci --no-audit --no-fund --ignore-scripts
          npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: ["PowerShellUniversal.Component.ECharts", "PowerShellUniversal.Component.ECharts.Demo", "PowerShellUniversal.Component.Perspective"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build module
        shell: pwsh
        run: ./build/Build-Module.ps1 -Module '${{ matrix.module }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.module }}
          path: output/${{ matrix.module }}
          retention-days: 14

  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name Pester -Version 6.2.0 -TrustRepository -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -TrustRepository -Quiet
          # one call per folder: a call per file once failed with "more than one dynamic module in each
          # dynamic assembly" and hung the job (#39). Findings in node_modules or build output do not count.
          $findings = foreach ($folder in 'modules', 'shared', 'build', 'tests') {
              Invoke-ScriptAnalyzer -Path $folder -Recurse -Severity Warning, Error |
                  Where-Object ScriptPath -NotMatch '[\\/](node_modules|public|output)[\\/]'
          }
          $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings) { throw ('PSScriptAnalyzer: {0} finding(s)' -f @($findings).Count) }
          Import-Module Pester -RequiredVersion 6.2.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  site:
    # the documentation site the browser tests open (Build-Site.ps1 needs pwsh, which the Playwright
    # image lacks; Zensical with the shared design of eizedev/brand)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Examples, reference and the charts script
        shell: pwsh
        run: ./docs/site/Build-Site.ps1
      - uses: eizedev/brand/docs-site@8d8d554bf72868842330a40a61e843ec631edcf5 # v1.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/

  browser:
    # the documentation site renders the module's own component: tested in Chromium, Firefox and WebKit.
    # Playwright's own image carries the browsers and their system libraries, so nothing is installed
    # with apt (the Ubuntu mirror made "playwright install --with-deps" run into the timeout). Its
    # version must be the one of @playwright/test in package-lock.json; tests/js/ci.test.js checks that.
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/
      - name: Browser tests
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run test:browser

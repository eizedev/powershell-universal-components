    { "Releases" = "development/release.md" },
    { "Decisions" = "decisions/index.md" },
  ] },
]

# addresses of pages that are gone, to the page that has their content now
[project.plugins.redirects.redirect_maps]
"pivot/upgrade.md" = "pivot/templates.md"

# llms.txt, llms-full.txt and a Markdown file per page for AI tools, from the pages of these sections
# (every page in exactly one, tests/js/llms-sections.test.js)
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
Custom components for PowerShell Universal (PSU) apps, MIT licensed, each a PowerShell module from the
PowerShell Gallery: PowerShellUniversal.Component.ECharts (`New-UDEChart`, Apache ECharts charts),
PowerShellUniversal.Component.Perspective (`New-UDPerspective`, the Perspective datagrid with pivot and
charts) and PowerShellUniversal.Component.Pivot (`New-UDPivotReport`, a pivot report builder built on
pivotkit, and `Invoke-UDPivotReport`, its views as files without a browser), plus the showcase apps PowerShellUniversal.Component.ECharts.Demo and
PowerShellUniversal.Component.Pivot.Demo. Data goes in as it comes from SQL (DataTable), REST or
PowerShell objects. Not affiliated with Devolutions. llms-full.txt holds every page listed here in one file.
"""

[project.plugins.llmstxt.sections]
"Start" = ["index.md", "getting-started.md", "versioning.md"]
"ECharts module" = ["echarts/*.md", "demo.md"]
"Perspective module" = ["perspective/*.md"]
"Pivot module" = ["pivot/*.md"]
"Development (build, test, release)" = ["development/*.md"]
"Decisions" = ["decisions/*.md"]

[project.theme]
# overrides/main.html adds the Open Graph and Twitter card tags to every page
custom_dir = "overrides"
language = "en"
logo = "assets/images/icon.svg"
favicon = "assets/images/icon.svg"
# Fonts come from the system; nothing is loaded from Google.
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.expand",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
# the generated examples and reference (docs/site/Build-Site.ps1); a missing one fails the build
pymdownx.snippets = { base_path = ["docs/site/generated"], check_paths = true }

<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
    /* colours as PSU's light and dark mode; the chart component reads text and background from here */
    :root { --bg: #f0f2f5; --surface: #ffffff; --text: #303133; --muted: #6e7079; --line: #e4e7ed; --code: #f6f8fa; --accent: #1976d2; }
    :root[data-theme="dark"] { --bg: #000000; --surface: #1e1e1e; --text: rgba(255, 255, 255, 0.85); --muted: #a3a8b3; --line: #2f3238; --code: #121417; --accent: #64b5f6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); }
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
    nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 16px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
    nav .brand { font-weight: 600; margin-bottom: 8px; }
    nav a { text-decoration: none; padding: 2px 0; }
    nav .theme { margin: 4px 0 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; text-align: left; }
    main { padding: 24px 32px 64px; max-width: 1200px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 40px 0 12px; font-size: 22px; }
    h3 { margin: 0 0 6px; font-size: 17px; }
    .example, .intro, .command { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 0 0 20px; }
    .example p, .command p { margin: 0 0 10px; color: var(--muted); }
    .small { font-size: 13px; color: var(--muted); }
    .chart { margin: 8px 0 12px; }
    .code { position: relative; }
    .code pre { margin: 0; padding: 12px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code .copy { position: absolute; top: 6px; right: 6px; padding: 2px 8px; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--text); cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    td:first-child { white-space: nowrap; }
    .toast { position: fixed; right: 16px; bottom: 16px; max-width: min(480px, calc(100vw - 32px)); max-height: 50vh; overflow: auto; padding: 12px 14px; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); font-size: 13px; }
    .toast pre { margin: 6px 0 0; white-space: pre-wrap; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
    @media (max-width: 800px) {
        .layout { grid-template-columns: 1fr; }
        nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; gap: 4px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
        nav .brand { width: 100%; margin: 0; }
        main { padding: 16px; }
    }
</style>
</head>
<body>
<div id="app"></div>
<script id="site-data" type="application/json">{{DATA}}</script>
<script src="site.js"></script>
</body>
</html>
